name: Build DX MASTER APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest project zip
        run: |
          mkdir -p _proj
          Z=$(for f in *.zip; do [ -f "$f" ] && echo "$(git log -1 --format=%ct -- "$f")|$f"; done | sort -t'|' -k1,1n | tail -n 1 | cut -d'|' -f2-)
          echo "Using zip: $Z"
          if [ -n "$Z" ]; then unzip -oq "$Z" -d _proj; fi
          find _proj -maxdepth 3 | head -40
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          F=$(find _proj . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle not found"; exit 1; fi
          DIR=$(dirname "$F")
          echo "Project dir: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DX-MASTER-APK
          path: '**/build/outputs/apk/debug/*.apk'
